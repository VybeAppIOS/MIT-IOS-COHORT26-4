# Task X-2: the full check (SwiftLint, then app and VybeKit tests) on macOS.
# macOS minutes are expensive, so this runs only for PRs that are ready for review (not drafts),
# skips PRs that change only docs, and cancels a run when a newer push replaces it.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh (Xcode 27.1, iPhone 17)
    if: github.event.pull_request.draft == false
    # `xcode-27` is GitHub's standard (not "-large"/"-xlarge") runner with Xcode 27, in public preview.
    # Label source: https://github.com/actions/runner-images/issues/14404 and the runner-images README.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pin Xcode 27.1, the team's version (docs/ARCHITECTURE.md 0), instead of the image default.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # An iPhone listed for this image (iOS 27.0 runtime); check.sh reads SIMULATOR.
      SIMULATOR: iPhone 17
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode and simulators
        run: |
          test -d "$DEVELOPER_DIR" || { echo "Xcode 27.1 not found at $DEVELOPER_DIR"; exit 1; }
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install SwiftLint (not on the xcode-27 image)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Run check.sh
        run: ./scripts/check.sh
